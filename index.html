<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi Digital</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* Glass Card */
.container {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    width: 90%;
    max-width: 400px;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    text-align: center;
    color: white;
    animation: fadeIn 0.8s ease;
}

.hero img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 15px;
    margin-bottom: 20px;
}

h2 {
    margin-bottom: 15px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 12px;
    border: none;
    outline: none;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: #ffffff;
    color: #764ba2;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    background: #f1f1f1;
}

.hidden {
    display: none;
}

/* Spinner */
.spinner {
    border: 4px solid rgba(255,255,255,0.3);
    border-top: 4px solid white;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    margin: 15px auto;
    animation: spin 1s linear infinite;
}

/* Animations */
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px);}
    to { opacity: 1; transform: translateY(0);}
}

</style>
</head>

<body>

<div class="container">

    <div class="hero">
        <!-- GANTI dengan nama file gambar kamu -->
        <img src="IMG-20260216-WA0007.jpg" alt="Absensi">
    </div>

    <!-- STEP 1 -->
    <div id="step1">
        <h2>Silahkan isi nama anda</h2>
        <input type="text" id="nama" placeholder="Nama Lengkap">
        <button onclick="nextStep()">Lanjut</button>
    </div>

    <!-- LOADING -->
    <div id="loading" class="hidden">
        <div class="spinner"></div>
        <p>Memproses...</p>
    </div>

    <!-- STEP 2 -->
    <div id="step2" class="hidden">
        <h2>Masukkan jabatan anda</h2>
        <input type="text" id="posisi" placeholder="Jabatan">
        <button onclick="kirimData()">Kirim Absensi</button>
    </div>

</div>

<script>

let namaGlobal = "";

function nextStep() {
    const nama = document.getElementById("nama").value;

    if(nama === "") {
        alert("Nama belum diisi!");
        return;
    }

    namaGlobal = nama;

    document.getElementById("step1").classList.add("hidden");
    document.getElementById("loading").classList.remove("hidden");

    setTimeout(() => {
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("step2").classList.remove("hidden");
    }, 1500);
}

function kirimData() {
    const posisi = document.getElementById("posisi").value;

    if(posisi === "") {
        alert("Jabatan belum diisi!");
        return;
    }

    var token = "8588288437:AAF55Cst6oQzNmm8qlFfM1fij_J2UgUJVSQ";
    var chat_id = "8465582504";

    var pesan = 
        "📋 ABSENSI MASUK\n\n" +
        "👤 Nama: " + namaGlobal + "\n" +
        "📌 Jabatan: " + posisi;

    var url = "https://api.telegram.org/bot" + token +
              "/sendMessage?chat_id=" + chat_id +
              "&text=" + encodeURIComponent(pesan);

    fetch(url)
    .then(response => response.json())
    .then(data => {
        alert("Absensi berhasil dikirim!");
        location.reload();
    })
    .catch(error => {
        alert("Terjadi kesalahan!");
    });
}

</script>

</body>
</html>
