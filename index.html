<!DOCTYPE html>
<html>
<head>
    <title>Absensi Bertahap</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 400px;
            margin: 80px auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            width: 95%;
            padding: 12px;
            background: #4facfe;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .loading {
            font-size: 18px;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- STEP 1 -->
    <div id="step1">
        <h2>Silakan isi nama Anda</h2>
        <input type="text" id="nama" placeholder="Nama">
        <button onclick="nextStep()">Lanjut</button>
    </div>

    <!-- LOADING -->
    <div id="loading" class="hidden">
        <p class="loading">⏳ Memproses...</p>
    </div>

    <!-- STEP 2 -->
    <div id="step2" class="hidden">
        <h2>Masukkan jabatan Anda</h2>
        <input type="text" id="posisi" placeholder="Jabatan">
        <button onclick="kirimAbsensi()">Kirim Absensi</button>
    </div>

</div>

<script>
function nextStep() {
    var nama = document.getElementById("nama").value;

    if (nama.trim() === "") {
        alert("Nama wajib diisi!");
        return;
    }

    document.getElementById("step1").classList.add("hidden");
    document.getElementById("loading").classList.remove("hidden");

    setTimeout(function() {
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("step2").classList.remove("hidden");
    }, 1000);
}

function kirimAbsensi() {
    var nama = document.getElementById("nama").value;
    var posisi = document.getElementById("posisi").value;

    if (posisi.trim() === "") {
        alert("Jabatan wajib diisi!");
        return;
    }

    var token = "TOKEN_KAMU";
    var chat_id = "8465582504";

    var waktu = new Date().toLocaleString();

    var pesan = "📋 ABSENSI MASUK\n\n" +
                "👤 Nama: " + nama + "\n" +
                "📌 Jabatan: " + posisi + "\n" +
                "⏰ Waktu: " + waktu;

    var url = "https://api.telegram.org/bot" + token +
              "/sendMessage?chat_id=" + chat_id +
              "&text=" + encodeURIComponent(pesan);

    fetch(url)
    .then(response => response.json())
    .then(data => {
        alert("Absensi berhasil dikirim!");
        location.reload();
    })
    .catch(error => {
        alert("Gagal mengirim!");
    });
}
</script>

</body>
</html>
