<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi Digital</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
}

/* CARD */
.container {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    width: 90%;
    max-width: 380px;
    padding: 25px;
    border-radius: 25px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    color: white;
    position: relative;
    overflow: hidden;
}

/* Progress Bar */
.progress {
    height: 6px;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    margin-bottom: 20px;
}

.progress-bar {
    height: 100%;
    width: 50%;
    background: #00ffcc;
    border-radius: 10px;
    transition: 0.5s;
}

/* Image */
.hero img {
    width: 100%;
    height: 170px;
    object-fit: cover;
    border-radius: 20px;
    margin-bottom: 20px;
}

/* Steps */
.step {
    transition: 0.5s;
}

.hidden {
    opacity: 0;
    transform: translateX(100%);
    position: absolute;
    width: 100%;
}

.active {
    opacity: 1;
    transform: translateX(0);
    position: relative;
}

h2 {
    margin-bottom: 15px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 12px 0;
    border-radius: 15px;
    border: none;
    outline: none;
    font-size: 14px;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    border-radius: 15px;
    border: none;
    background: #00ffcc;
    color: #003333;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
}

/* Spinner */
.spinner {
    border: 4px solid rgba(255,255,255,0.3);
    border-top: 4px solid white;
    border-radius: 50%;
    width: 35px;
    height: 35px;
    margin: 20px auto;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg);}
    100% { transform: rotate(360deg);}
}

</style>
</head>

<body>

<div class="container">

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="hero">
        <img src="IMG-20260216-WA0007.jpg">
    </div>

    <!-- STEP 1 -->
    <div id="step1" class="step active">
        <h2>Masukkan Nama Anda</h2>
        <input type="text" id="nama" placeholder="Nama Lengkap">
        <button onclick="nextStep()">Lanjut</button>
    </div>

    <!-- LOADING -->
    <div id="loading" class="step hidden">
        <div class="spinner"></div>
        <p style="text-align:center;">Memproses...</p>
    </div>

    <!-- STEP 2 -->
    <div id="step2" class="step hidden">
        <h2>Masukkan Jabatan</h2>
        <input type="text" id="posisi" placeholder="Jabatan">
        <button onclick="kirimData()">Kirim Absensi</button>
    </div>

</div>

<script>

let namaGlobal = "";

function nextStep() {
    const nama = document.getElementById("nama").value;
    if(nama === "") {
        alert("Nama belum diisi!");
        return;
    }

    namaGlobal = nama;

    document.getElementById("step1").classList.remove("active");
    document.getElementById("step1").classList.add("hidden");

    document.getElementById("loading").classList.remove("hidden");
    document.getElementById("loading").classList.add("active");

    setTimeout(() => {
        document.getElementById("loading").classList.remove("active");
        document.getElementById("loading").classList.add("hidden");

        document.getElementById("step2").classList.remove("hidden");
        document.getElementById("step2").classList.add("active");

        document.getElementById("progressBar").style.width = "100%";
    }, 1200);
}

function kirimData() {
    const posisi = document.getElementById("posisi").value;

    if(posisi === "") {
        alert("Jabatan belum diisi!");
        return;
    }

    var token = "8588288437:AAF55Cst6oQzNmm8qlFfM1fij_J2UgUJVSQ";
    var chat_id = "8465582504";

    var pesan =
        "📋 ABSENSI MASUK\n\n" +
        "👤 Nama: " + namaGlobal + "\n" +
        "📌 Jabatan: " + posisi;

    var url = "https://api.telegram.org/bot" + token +
              "/sendMessage?chat_id=" + chat_id +
              "&text=" + encodeURIComponent(pesan);

    fetch(url)
    .then(response => response.json())
    .then(data => {
        alert("Absensi berhasil dikirim!");
        location.reload();
    })
    .catch(error => {
        alert("Terjadi kesalahan!");
    });
}

</script>

</body>
</html>
